<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliografía y Recursos de la Asignatura — PFC UTN FRSF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --azul: #003D7C;
  --celeste: #0070C0;
  --celeste-claro: #E8F4FD;
  --gris-fondo: #F2F5F9;
  --gris-borde: #E2E8F0;
  --gris-texto: #2D3748;
  --gris-medio: #8896A8;
  --blanco: #ffffff;
  --verde: #27AE60;
  --ambar: #D97706;
  --col-pdf: #C0392B;
  --col-curso: #0070C0;
  --col-video: #CC0000;
  --col-podcast: #8E24AA;
  --col-excel: #1E7E34;
  --col-doc: #2F5496;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--gris-fondo); color: var(--gris-texto); min-height: 100vh; }

/* HEADER */
.header {
  background: var(--azul);
  padding: 1rem 1.5rem;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 200;
  box-shadow: 0 2px 12px rgba(0,61,124,0.2);
  gap: 1rem;
  flex-wrap: wrap;
}
.header-logo { height: 30px; width: auto; display: block; }
.header-titulo {
  font-family: 'DM Serif Display', serif;
  color: var(--blanco); font-size: 1rem;
  display: none;
}
.buscador-wrap { flex: 1; max-width: 420px; position: relative; }
.buscador {
  width: 100%; padding: 0.55rem 1rem 0.55rem 2.5rem;
  border: 1.5px solid rgba(255,255,255,0.3);
  border-radius: 8px; background: rgba(255,255,255,0.12);
  color: var(--blanco); font-size: 0.85rem; font-family: 'Inter', sans-serif;
  outline: none;
}
.buscador::placeholder { color: rgba(255,255,255,0.55); }
.buscador:focus { border-color: rgba(255,255,255,0.6); background: rgba(255,255,255,0.18); }
.buscador-icon {
  position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);
  color: rgba(255,255,255,0.55); pointer-events: none;
}
.header-count {
  font-size: 0.75rem; color: rgba(255,255,255,0.65);
  white-space: nowrap;
}

/* LAYOUT */
.layout { display: flex; min-height: calc(100vh - 56px); }

/* SIDEBAR */
.sidebar {
  width: 260px; flex-shrink: 0;
  background: var(--blanco);
  border-right: 1px solid var(--gris-borde);
  padding: 1.25rem 0;
  position: sticky; top: 56px;
  height: calc(100vh - 56px);
  overflow-y: auto;
}
.sidebar-section { margin-bottom: 0.25rem; }
.sidebar-seccion-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 0.7rem 1.25rem;
  background: none; border: none;
  font-family: 'Inter', sans-serif; font-size: 0.82rem; font-weight: 600;
  color: var(--azul); cursor: pointer; text-align: left;
  transition: background 0.15s;
}
.sidebar-seccion-btn:hover { background: var(--celeste-claro); }
.sidebar-seccion-btn.activa { background: var(--celeste-claro); }
.sidebar-chevron { transition: transform 0.2s; font-size: 0.7rem; color: var(--gris-medio); }
.sidebar-seccion-btn.activa .sidebar-chevron { transform: rotate(180deg); }
.sidebar-subsecciones { display: none; }
.sidebar-subsecciones.visible { display: block; }
.sidebar-sub-btn {
  width: 100%; display: flex; align-items: center; gap: 0.5rem;
  padding: 0.5rem 1.25rem 0.5rem 2rem;
  background: none; border: none;
  font-family: 'Inter', sans-serif; font-size: 0.78rem;
  color: var(--gris-texto); cursor: pointer; text-align: left;
  transition: all 0.15s; border-left: 2px solid transparent; margin-left: 0;
}
.sidebar-sub-btn:hover { color: var(--azul); background: #F8FAFC; }
.sidebar-sub-btn.activo { color: var(--celeste); font-weight: 600; border-left-color: var(--celeste); background: var(--celeste-claro); }
.sidebar-sub-count {
  margin-left: auto; font-size: 0.68rem; font-weight: 600;
  background: var(--gris-fondo); color: var(--gris-medio);
  padding: 0.1rem 0.45rem; border-radius: 10px;
}
.sidebar-divider { height: 1px; background: var(--gris-borde); margin: 0.75rem 1.25rem; }
.sidebar-filtros-titulo {
  padding: 0.5rem 1.25rem 0.35rem;
  font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--gris-medio);
}
.filtro-grupo { padding: 0.25rem 1.25rem 0.5rem; display: flex; flex-wrap: wrap; gap: 0.35rem; }
.filtro-chip {
  padding: 0.25rem 0.65rem; border-radius: 20px;
  font-size: 0.72rem; font-weight: 500;
  border: 1.5px solid var(--gris-borde);
  background: none; cursor: pointer; font-family: 'Inter', sans-serif;
  color: var(--gris-texto); transition: all 0.15s;
}
.filtro-chip:hover { border-color: var(--celeste); color: var(--celeste); }
.filtro-chip.activo { background: var(--celeste); border-color: var(--celeste); color: white; font-weight: 600; }

/* CONTENIDO */
.contenido { flex: 1; padding: 1.5rem; min-width: 0; }
.seccion-titulo {
  font-family: 'DM Serif Display', serif;
  font-size: 1.4rem; color: var(--azul);
  margin-bottom: 0.25rem;
}
.seccion-desc { font-size: 0.82rem; color: var(--gris-medio); margin-bottom: 1.25rem; }
.subseccion-titulo {
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--gris-medio);
  margin: 1.5rem 0 0.75rem; padding-bottom: 0.5rem;
  border-bottom: 1px solid var(--gris-borde);
  display: flex; align-items: center; gap: 0.5rem;
}
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 0.85rem; }
.vacio { text-align: center; padding: 3rem 1rem; color: var(--gris-medio); font-size: 0.9rem; }

/* CARDS */
.card {
  background: var(--blanco); border-radius: 10px;
  border: 1.5px solid var(--gris-borde);
  padding: 1rem 1.1rem;
  display: flex; flex-direction: column; gap: 0.5rem;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.card:hover { border-color: #B8D4F0; box-shadow: 0 3px 12px rgba(0,61,124,0.08); }
.card-top { display: flex; align-items: flex-start; gap: 0.65rem; }
.tipo-badge {
  flex-shrink: 0; border-radius: 5px;
  padding: 0.2rem 0.55rem;
  font-size: 0.62rem; font-weight: 700; letter-spacing: 0.06em;
  text-transform: uppercase; color: white;
  margin-top: 1px;
}
.tipo-PDF { background: var(--col-pdf); }
.tipo-Curso { background: var(--col-curso); }
.tipo-Video { background: var(--col-video); }
.tipo-Podcast { background: var(--col-podcast); }
.tipo-Excel { background: var(--col-excel); }
.tipo-Doc { background: var(--col-doc); }

.card-titulo { font-size: 0.88rem; font-weight: 600; line-height: 1.4; color: var(--gris-texto); flex: 1; }
.card-meta { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.card-inst { font-size: 0.75rem; color: var(--gris-medio); }
.idioma-badge {
  font-size: 0.65rem; font-weight: 600;
  padding: 0.1rem 0.4rem; border-radius: 4px;
  background: var(--gris-fondo); color: var(--gris-medio);
  border: 1px solid var(--gris-borde);
}
.acceso-badge {
  font-size: 0.67rem; font-weight: 600;
  padding: 0.15rem 0.5rem; border-radius: 4px;
}
.acceso-libre { background: #EAFAF1; color: var(--verde); border: 1px solid #A9DFBF; }
.acceso-cert { background: #FEF3E2; color: var(--ambar); border: 1px solid #FAD7A0; }
.acceso-interno { background: #EEF2FF; color: #3730A3; border: 1px solid #C7D2FE; }
.unidad-badge {
  font-size: 0.65rem; font-weight: 600;
  padding: 0.1rem 0.45rem; border-radius: 4px;
  background: var(--celeste-claro); color: var(--azul);
  border: 1px solid #B8D4F0;
}
.clase-badge {
  font-size: 0.65rem; font-weight: 600;
  padding: 0.1rem 0.45rem; border-radius: 4px;
  background: #FEF3E2; color: var(--ambar);
  border: 1px solid #FAD7A0;
}
.general-badge {
  font-size: 0.65rem; font-weight: 600;
  padding: 0.1rem 0.45rem; border-radius: 4px;
  background: var(--gris-fondo); color: var(--gris-medio);
  border: 1px solid var(--gris-borde);
}
.nivel-badge {
  font-size: 0.65rem; font-weight: 700;
  padding: 0.1rem 0.5rem; border-radius: 4px;
}
.nivel-badge.nivel-1 { background: var(--azul); color: white; }
.nivel-badge.nivel-3 { background: var(--verde); color: white; }
.card-tema { font-size: 0.72rem; color: var(--gris-medio); font-style: italic; }
.card-desc { font-size: 0.8rem; color: #4A5568; line-height: 1.55; }
.card-footer { margin-top: auto; display: flex; justify-content: flex-end; }
.btn-ir {
  font-size: 0.78rem; font-weight: 600;
  padding: 0.4rem 0.9rem; border-radius: 6px;
  background: var(--celeste-claro); color: var(--azul);
  border: 1px solid #B8D4F0; text-decoration: none;
  transition: background 0.15s;
  display: inline-block;
}
.btn-ir:hover { background: #C5DFF8; }
.btn-interno {
  font-size: 0.78rem; color: var(--gris-medio);
  padding: 0.4rem 0.9rem; border-radius: 6px;
  background: var(--gris-fondo); border: 1px solid var(--gris-borde);
  font-style: italic;
}

@media (max-width: 768px) {
  .sidebar { display: none; }
  .contenido { padding: 1rem; }
  .grid { grid-template-columns: 1fr; }
}
@media (min-width: 900px) { .header-titulo { display: block; } }
</style>
</head>

// ==================== ESTADO ====================
let filtrosSub = [];
let filtrosGuia = [];
let filtrosTipo = [];
let filtrosIdioma = [];
let filtrosAcceso = [];
let filtrosUnidad = [];
let filtrosNivel = [];
let textoBusqueda = '';

// ==================== RENDER ====================
function render() {
  const contenido = document.getElementById('contenido');
  let filtered = recursos;

  // Todos los filtros son facetas independientes que se combinan (AND) sobre
  // el catalogo completo. Por defecto (sin nada seleccionado) se ve todo.
  if (filtrosSub.length) filtered = filtered.filter(r => filtrosSub.includes(r.sub));
  if (filtrosGuia.includes('si')) filtered = filtered.filter(r => !!r.clase);
  if (filtrosTipo.length) filtered = filtered.filter(r => filtrosTipo.includes(r.tipo));
  if (filtrosIdioma.length) filtered = filtered.filter(r => filtrosIdioma.some(l => r.idioma.includes(l)));
  if (filtrosAcceso.length) filtered = filtered.filter(r => filtrosAcceso.includes(r.acceso));
  if (filtrosUnidad.length) filtered = filtered.filter(r => r.unidad && filtrosUnidad.some(u => r.unidad.includes(u)));
  if (filtrosNivel.length) filtered = filtered.filter(r => filtrosNivel.includes(r.nivel));
  if (textoBusqueda) {
    const q = textoBusqueda.toLowerCase();
    filtered = filtered.filter(r =>
      r.titulo.toLowerCase().includes(q) ||
      r.inst.toLowerCase().includes(q) ||
      r.desc.toLowerCase().includes(q) ||
      r.sub.toLowerCase().includes(q) ||
      (r.tema && r.tema.toLowerCase().includes(q)) ||
      (r.clase && r.clase.toLowerCase().includes(q))
    );
  }

  document.getElementById('headerCount').textContent = filtered.length + ' recurso' + (filtered.length !== 1 ? 's' : '');

  if (filtered.length === 0) {
    contenido.innerHTML = '<div class="vacio">No se encontraron recursos con ese criterio de búsqueda.</div>';
    return;
  }

  const subInfo = {
    A1: { nombre: 'A1 · Introducción y ciclo de vida del proyecto', desc: 'Guías, cursos y herramientas para comprender el ciclo completo de formulación de proyectos de inversión pública.' },
    A2: { nombre: 'A2 · Diagnóstico territorial y árbol de problemas', desc: 'Metodologías para identificar el problema central, sus causas y efectos, y herramientas de diagnóstico participativo.' },
    A3: { nombre: 'A3 · Análisis de actores e involucrados', desc: 'Técnicas para identificar, clasificar y analizar a los actores relevantes para un proyecto.' },
    A4: { nombre: 'A4 · Marco lógico y formulación de objetivos', desc: 'Metodología de Marco Lógico: árbol de objetivos, estructura analítica e indicadores SMART.' },
    A5: { nombre: 'A5 · Evaluación económica y financiera', desc: 'Herramientas para el análisis costo-beneficio, VAN, TIR y fuentes de financiamiento público.' },
    A6: { nombre: 'A6 · Análisis de brechas e infraestructura', desc: 'Metodologías para calcular brechas de infraestructura y análisis de riesgo de desastres.' },
    A7: { nombre: 'A7 · Evaluación de impacto ambiental', desc: 'Guías y cursos para elaborar estudios de impacto ambiental y gestionar riesgos socioambientales.' },
    A8: { nombre: 'A8 · Marco legal e institucional', desc: 'Normativa, reglamentos y cursos sobre el marco jurídico de los proyectos de ingeniería civil.' },
    A9: { nombre: 'A9 · Comunicación técnica escrita', desc: 'Recursos para mejorar la redacción de informes técnicos, memorias descriptivas y documentación del PFC.' },
    A10: { nombre: 'A10 · Comunicación oral y presentaciones', desc: 'Guías y recursos para preparar presentaciones técnicas y la defensa oral ante el tribunal.' },
    C1: { nombre: 'C1 · Normativa institucional', desc: 'Reglamento de PFC y ordenanza del plan de estudios de Ingeniería Civil vigentes en UTN FRSF.' },
    C2: { nombre: 'C2 · CAI — Ejercicio profesional', desc: 'Documentos del Centro Argentino de Ingenieros sobre alcances, gestión y ética del ejercicio profesional.' },
    C3: { nombre: 'C3 · CEPAL — Metodología de proyectos', desc: 'Manuales de la Serie Manuales de CEPAL/ILPES sobre licitaciones, formulación y marco lógico.' },
    C4: { nombre: 'C4 · Formulación de proyectos — CFI y DNP Colombia', desc: 'Guía de formulación BFPI del CFI (Argentina) y el enfoque matricial de estructuración de proyectos del DNP (Colombia): dos formas distintas de organizar las mismas fases de perfil, prefactibilidad y factibilidad.' },
    C5: { nombre: 'C5 · DNIP — Guías de evaluación y brechas', desc: 'Guías oficiales argentinas de evaluación ex ante, ex post, sectoriales y de brechas de infraestructura.' },
    C6: { nombre: 'C6 · Marco lógico — Herramientas y ejemplos', desc: 'Cajas de herramientas, libros y la matriz propia de la cátedra (MMLP) sobre marco lógico.' },
    C7: { nombre: 'C7 · Evaluación de proyectos — Libros de referencia', desc: 'Libros clásicos de evaluación económica y social de proyectos (Baca Urbina, Sapag, Fontaine, Cohen y Franco).' },
    C8: { nombre: 'C8 · Proyectos tipo — PROSAP/BID y GIRSAR', desc: 'Marco de Gestión Ambiental y Social (SGAS) de PROSAP/BID y guía GIRSAR de elaboración de proyectos a nivel de factibilidad.' },
    C9: { nombre: 'C9 · La ingeniería civil — Rol y futuro de la profesión', desc: 'Informes internacionales (ASCE, UNESCO, ICE, IPA, NEPC) sobre el rol y el futuro de la ingeniería civil.' },
  };

  let info;
  if (filtrosSub.length === 1) {
    info = subInfo[filtrosSub[0]] || { nombre: filtrosSub[0], desc: '' };
  } else if (filtrosSub.length > 1) {
    info = { nombre: `${filtrosSub.length} secciones seleccionadas`, desc: filtrosSub.join(' · ') };
  } else {
    info = { nombre: 'Todos los recursos', desc: 'Bibliografía y recursos externos de la asignatura. Usá el buscador o los filtros del panel izquierdo para acotar la lista.' };
  }
  if (textoBusqueda) {
    info = { nombre: 'Resultados de búsqueda', desc: `Coincidencias con "${textoBusqueda}"` + (filtrosSub.length ? ` dentro de ${info.nombre}` : '') };
  }

  let html = `<h2 class="seccion-titulo">${info.nombre}</h2>
    <p class="seccion-desc">${info.desc}</p>
    <div class="grid">`;

  filtered.forEach(r => {
    const accesoBadge = r.acceso === 'libre'
      ? '<span class="acceso-badge acceso-libre">Acceso libre</span>'
      : r.acceso === 'cert'
      ? '<span class="acceso-badge acceso-cert">Contenido libre · Certificado pago</span>'
      : '<span class="acceso-badge acceso-interno">Material interno cátedra</span>';

    const btnIr = r.url && r.url !== '#'
      ? `<a href="${r.url}" target="_blank" rel="noopener" class="btn-ir">Ir al recurso →</a>`
      : `<span class="btn-interno">Disponible en el aula Moodle</span>`;

    const idiomaLabel = r.idioma === 'ES' ? 'ES' : r.idioma === 'EN' ? 'EN' : r.idioma;
    const unidadBadge = r.unidad ? `<span class="unidad-badge">${r.unidad}</span>` : '';
    const claseBadge = r.clase ? `<span class="clase-badge">${r.clase}</span>` : '';
    const nivelBadge = r.nivel === '1' ? `<span class="nivel-badge nivel-1">★ Fuente de los Apuntes</span>`
      : r.nivel === '3' ? `<span class="nivel-badge nivel-3">Recomendado</span>` : '';
    const generalBadge = (!r.clase && !r.nivel && r.sub && r.sub.startsWith('C')) ? `<span class="general-badge">Referencia general</span>` : '';
    const temaLine = r.tema ? `<div class="card-tema">Temas: ${r.tema}</div>` : '';

    html += `<div class="card">
      <div class="card-top">
        <span class="tipo-badge tipo-${r.tipo}">${r.tipo}</span>
        <span class="card-titulo">${r.titulo}</span>
      </div>
      <div class="card-meta">
        <span class="card-inst">${r.inst}</span>
        <span class="idioma-badge">${idiomaLabel}</span>
        ${accesoBadge}
        ${unidadBadge}
        ${nivelBadge}
        ${claseBadge}
        ${generalBadge}
      </div>
      <p class="card-desc">${r.desc}</p>
      ${temaLine}
      <div class="card-footer">${btnIr}</div>
    </div>`;
  });

  html += '</div>';
  contenido.innerHTML = html;
}

// ==================== NAVEGACIÓN ====================
function toggleSeccion(btn, seccion) {
  const subsec = document.getElementById('subsec-' + seccion);
  const isOpen = subsec.classList.contains('visible');
  btn.classList.toggle('activa', !isOpen);
  subsec.classList.toggle('visible', !isOpen);
}

function toggleFiltro(tipo, valor, btn) {
  let arr = tipo === 'sub' ? filtrosSub : tipo === 'guia' ? filtrosGuia : tipo === 'tipo' ? filtrosTipo : tipo === 'idioma' ? filtrosIdioma : tipo === 'acceso' ? filtrosAcceso : tipo === 'unidad' ? filtrosUnidad : filtrosNivel;
  const idx = arr.indexOf(valor);
  if (idx === -1) arr.push(valor);
  else arr.splice(idx, 1);
  btn.classList.toggle('activo');
  render();
}

function filtrar() {
  textoBusqueda = document.getElementById('buscador').value.trim();
  render();
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  // Panel de Sección A abierto por defecto (solo para facilitar la navegación,
  // no filtra nada); la lista arranca mostrando el catálogo completo.
  document.getElementById('subsec-A').classList.add('visible');
  document.querySelector('.sidebar-seccion-btn').classList.add('activa');
  render();
});
</script>
